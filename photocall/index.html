<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photocall - Andrea 26</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;background:#0a060e;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#d4c5d9;overflow-x:hidden}

.atmosphere{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.atmosphere::before{content:'';position:absolute;top:-30%;left:20%;width:70%;height:60%;background:radial-gradient(ellipse,rgba(74,21,75,0.35) 0%,transparent 70%);filter:blur(40px)}
.atmosphere::after{content:'';position:absolute;bottom:-20%;right:10%;width:60%;height:50%;background:radial-gradient(ellipse,rgba(232,160,191,0.12) 0%,transparent 70%);filter:blur(60px)}

.container{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1.5rem;max-width:420px;margin:0 auto}

.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:9999px;background:rgba(18,9,25,0.8);border:1px solid rgba(232,160,191,0.2);font-size:9px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#e8a0bf;margin-bottom:2rem}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#e8a0bf;box-shadow:0 0 6px #e8a0bf}

.icon-wrap{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#f3c2d6 0%,#e8a0bf 50%,#c57b9d 100%);display:flex;align-items:center;justify-content:center;margin:0 auto 2rem;box-shadow:0 0 40px rgba(232,160,191,0.3),0 0 80px rgba(232,160,191,0.1);animation:iconPulse 4s ease infinite}
.icon-wrap svg{width:36px;height:36px;fill:none;stroke:#0a060e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes iconPulse{0%,100%{box-shadow:0 0 40px rgba(232,160,191,0.3)}50%{box-shadow:0 0 55px rgba(232,160,191,0.45)}}

h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;color:#fff;letter-spacing:-0.01em;line-height:1.2;margin-bottom:0.5rem;text-align:center}
h1 em{font-style:italic;color:#fbb1d1}
.subtitle{font-size:14px;color:#9c8aab;text-align:center;margin-bottom:2.5rem;line-height:1.6}

/* Botones principales */
.actions{display:flex;flex-direction:column;gap:0.75rem;width:100%;margin-bottom:1.5rem}
.btn-primary{display:block;text-align:center;padding:14px 24px;background:linear-gradient(135deg,#f3c2d6 0%,#e8a0bf 50%,#c57b9d 100%);color:#0a060e;text-decoration:none;border:none;border-radius:9999px;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;box-shadow:inset 0 1px 1px rgba(255,255,255,0.6),0 0 24px rgba(232,160,191,0.4);transition:transform 0.2s;cursor:pointer;width:100%}
.btn-primary:active{transform:scale(0.97)}
.btn-secondary{display:block;text-align:center;padding:12px 24px;background:rgba(45,17,63,0.3);color:#f3c2d6;text-decoration:none;border:none;border-radius:9999px;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;border:1px solid rgba(232,160,191,0.35);transition:transform 0.2s;cursor:pointer;width:100%}
.btn-secondary:active{transform:scale(0.97)}

/* Preview foto */
.preview{display:none;width:100%;margin-bottom:1.5rem;text-align:center}
.preview img{width:200px;height:200px;object-fit:cover;border-radius:16px;border:2px solid rgba(232,160,191,0.3);box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.preview .name-field{margin-top:1rem}
.preview .name-field input{width:100%;padding:12px 16px;background:rgba(18,9,25,0.5);border:1px solid rgba(212,197,217,0.15);border-radius:12px;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;outline:none;text-align:center}
.preview .name-field input:focus{border-color:#e8a0bf;box-shadow:0 0 12px rgba(232,160,191,0.25)}
.preview .name-field input::placeholder{color:#9c8aab}

/* Progress */
.progress{display:none;width:100%;margin-bottom:1.5rem}
.progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:9999px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#e8a0bf,#f3c2d6);border-radius:9999px;transition:width 0.3s}
.progress-text{text-align:center;font-size:11px;color:#9c8aab;margin-top:0.5rem;letter-spacing:0.1em}

/* Success */
.success{display:none;text-align:center;animation:fadeIn 1s ease}
.ok-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,rgba(232,160,191,0.2),rgba(232,160,191,0.05));border:1px solid rgba(232,160,191,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem}
.ok-icon svg{width:36px;height:36px;fill:none;stroke:#e8a0bf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.success h2{font-family:'Playfair Display',serif;font-size:24px;font-weight:400;color:#fff;margin-bottom:0.8rem}
.success p{font-size:14px;color:#9c8aab;line-height:1.7}
.success .btn-otra{margin-top:1.5rem}

.footer{margin-top:2rem;font-size:9px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#9c8aab;opacity:0.5}

input[type="file"]{display:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.sparkle{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.sp{position:absolute;width:2px;height:2px;background:#e8a0bf;border-radius:50%;opacity:0;animation:sp 5s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:0;transform:scale(0)}40%,60%{opacity:0.5;transform:scale(1)}}
</style>
</head>
<body>
<div class="atmosphere"></div>
<div class="sparkle" id="sparkle"></div>

<div class="container">
  <div id="mainview">
    <div style="text-align:center">
      <div class="badge">cumple de andrea 2026</div>
    </div>

    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </div>

    <h1>Captura el <em>momento</em></h1>
    <p class="subtitle">Hazte una foto o elige una de tu galeria<br>y quedara guardada para siempre</p>

    <div class="preview" id="preview">
      <img id="previewImg" src="" alt="">
      <div class="name-field">
        <input type="text" id="nombre" placeholder="Tu nombre (opcional)" autocomplete="off">
      </div>
    </div>

    <div class="progress" id="progress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">Subiendo foto...</div>
    </div>

    <div class="actions" id="buttons">
      <button class="btn-primary" onclick="document.getElementById('cameraInput').click()">
        Hacer foto
      </button>
      <button class="btn-secondary" onclick="document.getElementById('galleryInput').click()">
        Elegir de galeria
      </button>
    </div>

    <div class="actions" id="uploadBtn" style="display:none">
      <button class="btn-primary" onclick="subir()">
        Subir foto
      </button>
      <button class="btn-secondary" onclick="cancelar()">
        Cancelar
      </button>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="seleccionar(this)">
    <input type="file" id="galleryInput" accept="image/*" onchange="seleccionar(this)">
  </div>

  <div class="success" id="successview">
    <div class="ok-icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h2>Foto subida</h2>
    <p>Andrea tendra este recuerdo<br>para siempre.</p>
    <div class="actions btn-otra">
      <button class="btn-secondary" onclick="otra()">Subir otra foto</button>
    </div>
  </div>

  <p class="footer">photocall digital</p>
</div>

<script>
const UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbxDgoSgQHh8GtgbSJWM973nI-OkKaortkFRrNpHdPL7BmOsiBxIKcVWyuJVIbBCtph-/exec';
let fotoBase64 = '';

function seleccionar(input){
  if(!input.files || !input.files[0]) return;
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = function(e){
    // Comprimir si es muy grande
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const MAX = 1920;
      let w = img.width, h = img.height;
      if(w > MAX || h > MAX){
        if(w > h){ h = h * MAX / w; w = MAX; }
        else{ w = w * MAX / h; h = MAX; }
      }
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      fotoBase64 = dataUrl.split(',')[1];
      document.getElementById('previewImg').src = dataUrl;
      document.getElementById('preview').style.display = 'block';
      document.getElementById('buttons').style.display = 'none';
      document.getElementById('uploadBtn').style.display = 'flex';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function cancelar(){
  fotoBase64 = '';
  document.getElementById('preview').style.display = 'none';
  document.getElementById('buttons').style.display = 'flex';
  document.getElementById('uploadBtn').style.display = 'none';
  document.getElementById('cameraInput').value = '';
  document.getElementById('galleryInput').value = '';
}

async function subir(){
  const nombre = document.getElementById('nombre').value.trim() || 'invitado';
  document.getElementById('uploadBtn').style.display = 'none';
  document.getElementById('preview').style.display = 'none';
  document.getElementById('progress').style.display = 'block';

  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');

  fill.style.width = '30%';
  text.textContent = 'Subiendo foto...';

  try{
    const resp = await fetch(UPLOAD_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({image: fotoBase64, nombre: nombre})
    });
    fill.style.width = '100%';
    text.textContent = 'Completado';
  }catch(err){
    fill.style.width = '100%';
  }

  setTimeout(function(){
    document.getElementById('progress').style.display = 'none';
    document.getElementById('mainview').querySelector('.icon-wrap').style.display = 'none';
    document.getElementById('mainview').querySelector('h1').style.display = 'none';
    document.getElementById('mainview').querySelector('.subtitle').style.display = 'none';
    document.getElementById('mainview').querySelector('.badge').parentElement.style.display = 'none';
    document.getElementById('successview').style.display = 'block';
  }, 800);
}

function otra(){
  fotoBase64 = '';
  document.getElementById('successview').style.display = 'none';
  document.getElementById('mainview').querySelector('.icon-wrap').style.display = '';
  document.getElementById('mainview').querySelector('h1').style.display = '';
  document.getElementById('mainview').querySelector('.subtitle').style.display = '';
  document.getElementById('mainview').querySelector('.badge').parentElement.style.display = '';
  document.getElementById('buttons').style.display = 'flex';
  document.getElementById('cameraInput').value = '';
  document.getElementById('galleryInput').value = '';
}

// Sparkles
const s=document.getElementById('sparkle');
for(let i=0;i<25;i++){
  const d=document.createElement('div');
  d.className='sp';
  d.style.left=Math.random()*100+'vw';
  d.style.top=Math.random()*100+'vh';
  d.style.animationDelay=Math.random()*8+'s';
  d.style.animationDuration=(4+Math.random()*4)+'s';
  d.style.width=d.style.height=(1.5+Math.random()*2)+'px';
  s.appendChild(d);
}
</script>
</body>
</html>
