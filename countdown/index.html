<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;background:#0a060e;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#d4c5d9;overflow-x:hidden}

.atmosphere{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.atmosphere::before{content:'';position:absolute;top:-30%;left:20%;width:70%;height:60%;background:radial-gradient(ellipse,rgba(74,21,75,0.35) 0%,transparent 70%);filter:blur(40px)}
.atmosphere::after{content:'';position:absolute;bottom:-20%;right:10%;width:60%;height:50%;background:radial-gradient(ellipse,rgba(232,160,191,0.12) 0%,transparent 70%);filter:blur(60px)}

.container{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1.5rem;max-width:420px;margin:0 auto}

.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:9999px;background:rgba(18,9,25,0.8);border:1px solid rgba(232,160,191,0.2);font-size:9px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#e8a0bf;margin-bottom:2rem}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#e8a0bf;box-shadow:0 0 6px #e8a0bf;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

.icon-wrap{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#f3c2d6 0%,#e8a0bf 50%,#c57b9d 100%);display:flex;align-items:center;justify-content:center;margin:0 auto 2rem;box-shadow:0 0 40px rgba(232,160,191,0.3),0 0 80px rgba(232,160,191,0.1);animation:iconPulse 4s ease infinite}
.icon-wrap span{font-size:38px;line-height:1}
@keyframes iconPulse{0%,100%{box-shadow:0 0 40px rgba(232,160,191,0.3)}50%{box-shadow:0 0 55px rgba(232,160,191,0.45)}}

h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;color:#fff;letter-spacing:-0.01em;line-height:1.2;margin-bottom:0.5rem;text-align:center}
h1 em{font-style:italic;color:#fbb1d1}
.subtitle{font-size:14px;color:#9c8aab;text-align:center;margin-bottom:2.5rem;line-height:1.6}

.countdown{display:flex;gap:0.75rem;justify-content:center;margin-bottom:2.5rem}
.unit{background:rgba(18,9,25,0.70);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-radius:16px;border:1px solid rgba(232,160,191,0.2);padding:1.2rem 0.8rem;min-width:80px;text-align:center;box-shadow:0 12px 32px -4px rgba(10,6,14,0.8)}
.unit .number{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:500;color:#fff;line-height:1}
.unit .label{font-size:9px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#e8a0bf;margin-top:6px}

.message{font-size:14px;color:#9c8aab;text-align:center;line-height:1.7}

/* Revealed state */
.hidden{display:none}
.revealed{animation:fadeIn 2s ease forwards}

.revealed h1{font-size:30px;margin-bottom:1rem}

.location-btn{display:inline-block;margin-top:2rem;padding:14px 32px;background:linear-gradient(135deg,#f3c2d6 0%,#e8a0bf 50%,#c57b9d 100%);color:#0a060e;text-decoration:none;border-radius:9999px;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;box-shadow:inset 0 1px 1px rgba(255,255,255,0.6),0 0 24px rgba(232,160,191,0.4);transition:transform 0.2s}
.location-btn:active{transform:scale(0.97)}

.footer{margin-top:2rem;font-size:9px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#9c8aab;opacity:0.5}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.sparkle{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.sp{position:absolute;width:2px;height:2px;background:#e8a0bf;border-radius:50%;opacity:0;animation:sp 5s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:0;transform:scale(0)}40%,60%{opacity:0.5;transform:scale(1)}}
</style>
</head>
<body>
<div class="atmosphere"></div>
<div class="sparkle" id="sparkle"></div>

<div class="container" id="waiting">
  <div style="text-align:center">
    <div class="badge">9 de noviembre</div>
  </div>

  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#0a060e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  </div>

  <h1>Algo especial <em>te espera</em></h1>
  <p class="subtitle">Ten paciencia...<br>merece la pena la espera</p>

  <div class="countdown" id="countdown">
    <div class="unit"><div class="number" id="hours">--</div><div class="label">horas</div></div>
    <div class="unit"><div class="number" id="mins">--</div><div class="label">min</div></div>
    <div class="unit"><div class="number" id="secs">--</div><div class="label">seg</div></div>
  </div>

  <p class="message">Pronto lo descubriras...</p>
  <p class="footer">9 de noviembre</p>
</div>

<div class="container hidden revealed" id="reveal">
  <div style="text-align:center">
    <div class="badge">ha llegado el momento</div>
  </div>

  <div class="icon-wrap">
    <span>&#128205;</span>
  </div>

  <h1>Nos vemos <em>aqui</em></h1>
  <p class="subtitle">Te estan esperando.<br>No llegues tarde.</p>

  <a class="location-btn" id="maplink" href="https://www.google.com/maps/place/37%C2%B059'15.6%22N+1%C2%B004'32.0%22W/@37.9876633,-1.0781153,17z/data=!3m1!4b1!4m4!3m3!8m2!3d37.9876633!4d-1.0755404?hl=es&entry=ttu" target="_blank">
    Abrir ubicacion
  </a>

  <p class="footer">9 de noviembre</p>
</div>

<script>
var REVEAL = new Date('2026-11-09T17:00:00+01:00');

function update(){
  var now = new Date();
  var diff = REVEAL - now;

  if(diff <= 0){
    document.getElementById('waiting').classList.add('hidden');
    document.getElementById('reveal').classList.remove('hidden');
    return;
  }

  var h = Math.floor(diff / 3600000);
  var m = Math.floor((diff % 3600000) / 60000);
  var s = Math.floor((diff % 60000) / 1000);

  document.getElementById('hours').textContent = String(h).padStart(2,'0');
  document.getElementById('mins').textContent = String(m).padStart(2,'0');
  document.getElementById('secs').textContent = String(s).padStart(2,'0');

  requestAnimationFrame(function(){ setTimeout(update, 200); });
}
update();

var sp = document.getElementById('sparkle');
for(var i = 0; i < 20; i++){
  var d = document.createElement('div');
  d.className = 'sp';
  d.style.left = Math.random()*100+'vw';
  d.style.top = Math.random()*100+'vh';
  d.style.animationDelay = Math.random()*8+'s';
  d.style.animationDuration = (4+Math.random()*4)+'s';
  d.style.width = d.style.height = (1.5+Math.random()*2)+'px';
  sp.appendChild(d);
}
</script>
</body>
</html>
